[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-aml"
version = "1.0.0"
description = "Federated Learning AML demo: Flower + PaySim"
license = "Apache-2.0"
dependencies = [
    "flwr==1.36.0",
    "scikit-learn>=1.3",
    "pandas",
    "pyarrow",
    "torch",
]

[tool.hatch.build.targets.wheel]
packages = ["fl_aml"]

[tool.flwr.app]
publisher = "fl-aml-demo"

[tool.flwr.app.components]
serverapp = "fl_aml.server_app:app"
clientapp = "fl_aml.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
model-type = "logreg"       # "logreg" | "mlp"
local-epochs = 10
class-weight = "none"       # "none" | "balanced"
min-nodes = 10
partitions-dir = "partitions"   # "partitions" (IID) | "partitions_noniid"
# data-dir and results-dir must be absolute paths at runtime because the
# ServerApp/ClientApp subprocesses do not run with the project as their cwd.
# scripts/run_experiment.sh injects them via --run-config; the placeholders
# below are overridden on every run.
data-dir = "data"
results-dir = "results/logreg"


#######################################################################
